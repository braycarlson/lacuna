name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_call:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        env:
            UV_PYTHON: 3.14+gil
        steps:
            - uses: actions/checkout@v7

            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.1

            - uses: astral-sh/setup-uv@v10.3.3

            - name: Install Python
              run: uv python install 3.15

            - name: Check
              run: zig build check --summary all

            - name: Check raw
              run: |
                  include=$(uv run --no-project --python 3.15 python -c "import sysconfig; print(sysconfig.get_paths()['include'])")
                  zig build raw "-Dpython-include=$include" --summary all
                  git diff --exit-code src/raw.zig

    wheel:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        env:
            UV_PYTHON: 3.14+gil
        steps:
            - uses: actions/checkout@v7

            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.1

            - uses: astral-sh/setup-uv@v10.3.3

            - name: Install Python
              run: uv python install 3.14

            - name: Build and audit wheels
              run: zig build wheel test:audit --summary all

    ci:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        env:
            UV_PYTHON: 3.14+gil
        steps:
            - uses: actions/checkout@v7

            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.1

            - uses: astral-sh/setup-uv@v10.3.3

            - name: Install Python
              run: uv python install 3.14 3.14t 3.15 3.15t pypy@3.11 pypy@3.12 graalpy@3.13

            - name: CI
              run: |
                  zig build test test:free-threaded test:abi3t test:versioned test:pypy test:graalpy \
                      test:backend test:types --summary all

            - name: Test ReleaseSafe
              run: zig build test:unit -Doptimize=safe --summary all

            - name: Test ABI 3.14t
              run: |
                  include=$(uv run --no-project --python 3.14t python -c "import sysconfig; print(sysconfig.get_paths()['include'])")
                  zig build test:abi "-Dpython-include=$include" -Dpython-free-threaded=3.14 --summary all

            - name: Test ABI 3.15t
              run: |
                  include=$(uv run --no-project --python 3.15t python -c "import sysconfig; print(sysconfig.get_paths()['include'])")
                  zig build test:abi "-Dpython-include=$include" -Dpython-free-threaded=3.15 --summary all

            - name: Test ABI PyPy
              if: runner.os == 'Linux'
              run: |
                  for version in 3.11 3.12; do
                      include=$(uv run --no-project --python "pypy@$version" python -c "import sysconfig; print(sysconfig.get_paths()['include'])")
                      zig build test:abi "-Dpython-include=$include" "-Dpython-pypy=$version" --summary all
                  done

            - name: Test ABI GraalPy
              if: runner.os == 'Linux'
              run: |
                  include=$(uv run --no-project --python graalpy@3.13 python -c "import sysconfig; print(sysconfig.get_paths()['include'])")
                  zig build test:abi "-Dpython-include=$include" -Dpython-graalpy=3.13 --summary all

    python:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        env:
            UV_PYTHON: ${{ matrix.python }}+gil
        steps:
            - uses: actions/checkout@v7

            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.1

            - uses: astral-sh/setup-uv@v10.3.3

            - name: Install Python
              run: uv python install "${{ matrix.python }}"

            - name: Test
              run: zig build test:python test:wheel test:stub test:property --summary all

            - name: Test ABI
              run: |
                  include=$(uv run --no-project python -c "import sysconfig; print(sysconfig.get_paths()['include'])")
                  zig build test:abi "-Dpython-include=$include" --summary all

    sanitize:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        env:
            UV_PYTHON: 3.14+gil
        steps:
            - uses: actions/checkout@v7

            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.1

            - uses: astral-sh/setup-uv@v10.3.3

            - name: Install Python
              run: uv python install 3.14

            - name: Test debug
              run: |
                  uv python install 3.14+debug
                  zig build test:debug --summary all

            - name: Test Valgrind
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes valgrind
                  uv venv "$RUNNER_TEMP/valgrind" --python 3.14+gil
                  uv pip install --python "$RUNNER_TEMP/valgrind/bin/python" pytest
                  PYTHONMALLOC=malloc zig build test:python -Doptimize=safe -Dcpu=x86_64_v3 \
                      -Dpython=valgrind -Dpython=--error-exitcode=99 -Dpython=--fair-sched=yes \
                      -Dpython=-q -Dpython=--track-origins=yes \
                      "-Dpython=$RUNNER_TEMP/valgrind/bin/python" \
                      --summary all

            - uses: actions/cache@v6
              with:
                  path: .zig-cache/tsan/prefix
                  key: tsan-${{ runner.os }}-${{ hashFiles('tools/tsan.py') }}

            - name: Test TSan
              run: |
                  sudo sysctl vm.mmap_rnd_bits=28
                  uv run --no-project python tools/tsan.py .zig-cache/tsan
                  zig build test:tsan "-Dpython-tsan=$PWD/.zig-cache/tsan/venv/bin/python" --summary all

    ios:
        runs-on: macos-latest
        defaults:
            run:
                shell: bash
        env:
            PYTHON_IOS_SHA256: 0f9fc7f61ceb8278a69fc7ec6089aad81789a96fa42f31cfe6d2f5f860d20a62
            PYTHON_IOS_URL: https://www.python.org/ftp/python/3.15.2/python-3.15.2-iOS-XCframework.tar.gz
        steps:
            - uses: actions/checkout@v7

            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.1

            - uses: astral-sh/setup-uv@v10.3.3

            - name: Build wheels
              run: zig build wheel:hello wheel:interop wheel:protocols wheel:sample wheel:wide --summary all

            - name: Download Python
              run: |
                  curl --fail --location --silent --show-error \
                      --output "$RUNNER_TEMP/python-ios.tar.gz" "$PYTHON_IOS_URL"
                  echo "$PYTHON_IOS_SHA256  $RUNNER_TEMP/python-ios.tar.gz" | shasum --algorithm 256 --check
                  mkdir "$RUNNER_TEMP/python-ios"
                  tar --extract --gzip --file "$RUNNER_TEMP/python-ios.tar.gz" --directory "$RUNNER_TEMP/python-ios"

            - name: Test iOS
              run: |
                  testbed="$RUNNER_TEMP/testbed"
                  uv run --no-project --python 3.15 python "$RUNNER_TEMP/python-ios/testbed" clone \
                      --framework "$RUNNER_TEMP/python-ios/Python.xcframework" "$testbed"
                  mkdir "$testbed/iOSTestbed/app/tests"
                  cp tests/conftest.py tests/test_hello.py tests/test_interop.py tests/test_protocols.py \
                      tests/test_sample.py tests/test_wide.py "$testbed/iOSTestbed/app/tests/"
                  uv run --no-project --python 3.15 --with pip python -m pip install --only-binary=:all: \
                      --platform ios_13_0_arm64_iphonesimulator --target "$testbed/iOSTestbed/app_packages" \
                      zig-out/dist/*-abi3-ios_13_0_arm64_iphonesimulator.whl pytest
                  uv run --no-project --python 3.15 python "$testbed" run -- pytest -p no:cacheprovider \
                      --deselect tests/test_interop.py::test_zig_panic_reports_the_call_and_the_python_stack \
                      tests

    pyodide:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7

            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.1

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install Pyodide
              run: npm install --prefix "$RUNNER_TEMP/pyodide" --no-audit --no-fund --ignore-scripts pyodide@314.0.7

            - name: Test Pyodide
              run: zig build test:pyodide "-Dpyodide=$RUNNER_TEMP/pyodide/node_modules/pyodide" --summary all
