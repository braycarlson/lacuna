name: release

on:
    push:
        tags: ["v*"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    EXTENSION: example
    DISTRIBUTION: example

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
              with:
                  version: 0.17.0

            - uses: astral-sh/setup-uv@v6

            - name: Build every wheel by cross-compiling from one runner
              run: zig build "wheel:$EXTENSION" --summary all

            - name: Build the source distribution through the lacuna_build backend
              run: uv build --sdist --out-dir zig-out/dist

            - uses: actions/upload-artifact@v4
              with:
                  name: distributions
                  path: zig-out/dist/*
                  if-no-files-found: error

    test:
        needs: build
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
                python: ["3.11", "3.15", "3.14t", "pypy3.11", "pypy3.12"]
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v6

            - uses: actions/download-artifact@v4
              with:
                  name: distributions
                  path: dist

            - name: Install the built wheel for this interpreter and run the tests
              run: |
                  uv venv --python "${{ matrix.python }}" .venv
                  uv pip install --python .venv --find-links dist --no-index --only-binary :all: "$DISTRIBUTION"
                  uv pip install --python .venv pytest
                  uv run --no-project --python .venv python -m pytest tests

    publish:
        needs: [build, test]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write
        steps:
            - uses: astral-sh/setup-uv@v6

            - uses: actions/download-artifact@v4
              with:
                  name: distributions
                  path: dist

            - name: Publish to PyPI with trusted publishing
              run: uv publish --trusted-publishing always dist/*
